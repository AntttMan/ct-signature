<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://appsforoffice.microsoft.com/lib/1.1/hosted/office.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 13px;
            color: #323130;
            padding: 16px;
            background: #faf9f8;
        }
        h1 {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #201f1e;
        }
        .subtitle {
            font-size: 12px;
            color: #605e5c;
            margin-bottom: 16px;
        }
        .field { margin-bottom: 12px; }
        label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            margin-bottom: 4px;
            color: #323130;
        }
        input[type="text"] {
            width: 100%;
            padding: 6px 8px;
            border: 1px solid #8a8886;
            border-radius: 2px;
            font-size: 13px;
            font-family: inherit;
            outline: none;
        }
        input[type="text"]:focus { border-color: #0078d4; }
        .hint {
            font-size: 11px;
            color: #605e5c;
            margin-top: 2px;
        }
        .btn {
            display: inline-block;
            padding: 8px 20px;
            font-size: 13px;
            font-weight: 600;
            border: none;
            border-radius: 2px;
            cursor: pointer;
            margin-top: 8px;
        }
        .btn-primary {
            background: #0078d4;
            color: #fff;
        }
        .btn-primary:hover { background: #106ebe; }
        .btn-primary:disabled {
            background: #c8c6c4;
            cursor: default;
        }
        .status {
            margin-top: 12px;
            padding: 8px 10px;
            border-radius: 2px;
            font-size: 12px;
            display: none;
        }
        .status.success { display: block; background: #dff6dd; color: #107c10; }
        .status.error   { display: block; background: #fde7e9; color: #a80000; }
        .status.info    { display: block; background: #deecf9; color: #0078d4; }
        .divider {
            border: none;
            border-top: 1px solid #edebe9;
            margin: 16px 0;
        }
        .current-config {
            font-size: 12px;
            color: #605e5c;
            padding: 8px 10px;
            background: #f3f2f1;
            border-radius: 2px;
        }
        .current-config b { color: #323130; }
    </style>
</head>
<body>
    <h1>CT Email Signature</h1>
    <p class="subtitle">Enter your details below. Your signature will be applied automatically to every new email.</p>

    <div class="field">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="e.g. Matteo Renecle">
    </div>
    <div class="field">
        <label for="designation">Designation</label>
        <input type="text" id="designation" placeholder="e.g. Director">
    </div>
    <div class="field">
        <label for="cell">Cell Number</label>
        <input type="text" id="cell" placeholder="e.g. +27 (60) 996 2197">
    </div>
    <div class="field">
        <label for="extension">Tel Extension <span style="font-weight:400;color:#605e5c;">(optional)</span></label>
        <input type="text" id="extension" placeholder="e.g. 2001">
        <div class="hint">Leave blank if you don't have a desk phone extension.</div>
    </div>
    <div class="field">
        <label for="email">Email (auto-detected)</label>
        <input type="text" id="email" disabled>
        <div class="hint">Uses your Outlook account email. Override only if your signature should show a different address.</div>
    </div>

    <button class="btn btn-primary" id="saveBtn" disabled>Save Signature</button>
    <button class="btn btn-primary" id="insertBtn" disabled style="margin-left:8px;background:#107c10;">Insert Now</button>
    <div class="status" id="status"></div>

    <hr class="divider">
    <div id="currentConfig"></div>

    <script>
        Office.onReady(function (info) {
            document.getElementById("saveBtn").disabled = false;

            var profileEmail = Office.context.mailbox.userProfile.emailAddress;
            document.getElementById("email").value = profileEmail;

            var existing = Office.context.roamingSettings.get("ct_signature_info");
            if (existing) {
                var data = JSON.parse(existing);
                document.getElementById("name").value = data.name || "";
                document.getElementById("designation").value = data.designation || "";
                document.getElementById("cell").value = data.cell || "";
                document.getElementById("extension").value = data.extension || "";
                if (data.email && data.email !== profileEmail) {
                    document.getElementById("email").value = data.email;
                    document.getElementById("email").disabled = false;
                }
                showCurrentConfig(data);
            }

            document.getElementById("saveBtn").onclick = save;
            document.getElementById("insertBtn").disabled = false;
            document.getElementById("insertBtn").onclick = insertNow;
        });

        function save() {
            var name = document.getElementById("name").value.trim();
            var designation = document.getElementById("designation").value.trim();
            var cell = document.getElementById("cell").value.trim();
            var extension = document.getElementById("extension").value.trim();
            var email = document.getElementById("email").value.trim();

            if (!name || !designation || !cell) {
                showStatus("Please fill in all fields.", "error");
                return;
            }

            var info = {
                name: name,
                designation: designation,
                cell: cell,
                extension: extension,
                email: email
            };

            document.getElementById("saveBtn").disabled = true;
            Office.context.roamingSettings.set("ct_signature_info", JSON.stringify(info));
            Office.context.roamingSettings.saveAsync(function (result) {
                document.getElementById("saveBtn").disabled = false;
                if (result.status === Office.AsyncResultStatus.Succeeded) {
                    showStatus("Signature saved. It will appear on your next new email.", "success");
                    showCurrentConfig(info);
                } else {
                    showStatus("Failed to save: " + result.error.message, "error");
                }
            });
        }

        var BASE_URL = "https://antttman.github.io/ct-signature";

        function insertNow() {
            var raw = Office.context.roamingSettings.get("ct_signature_info");
            if (!raw) {
                showStatus("Save your details first.", "error");
                return;
            }
            var info = JSON.parse(raw);
            var html = buildSignature(info);
            showStatus("Inserting signature...", "info");
            Office.context.mailbox.item.body.setSignatureAsync(
                html,
                { coercionType: "html" },
                function (result) {
                    if (result.status === Office.AsyncResultStatus.Succeeded) {
                        showStatus("Signature inserted.", "success");
                    } else {
                        showStatus("setSignatureAsync failed: " + result.error.message + " (code: " + result.error.code + ")", "error");
                    }
                }
            );
        }

        function esc(s) {
            if (!s) return '';
            return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function buildSignature(info) {
            var name = esc(info.name), designation = esc(info.designation);
            var cell = esc(info.cell), ext = esc(info.extension);
            var email = esc(info.email || Office.context.mailbox.userProfile.emailAddress);
            var mailtoEmail = info.email || Office.context.mailbox.userProfile.emailAddress;
            return [
                '<div style="font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;color:#000;">Kind regards,</div>',
                '<div style="font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;color:#000;"><br></div>',
                '<div style="background-color:#fff;margin:0;">',
                '<p style="margin:0;"><span style="font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;color:#000;"><b>' + name + '</b></span></p>',
                '<div style="font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;color:#000;"><b>' + designation + '</b></div>',
                '<div style="font-size:10pt;"><b><br></b></div>',
                '<div style="font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;color:#000;">',
                '<img alt="Combustion Technology" width="253" height="73" src="' + BASE_URL + '/assets/logo.png" style="width:253px;height:73px;"></div>',
                '<div style="font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;color:#000;"><b>LEAD | TRUST | RESPOND | PROTECT</b></div>',
                '<div style="font-size:10pt;"><br></div>',
                ext ? '<p style="line-height:normal;margin:0;font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;"><span style="color:#000;"><b>Tel: &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; &nbsp; </b></span><span style="color:rgb(0,120,212);"><b>+27 (21) 715 3171 ext. ' + ext + '</b></span></p>' : '',
                '<div style="line-height:normal;margin:0;font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;"><span style="color:#000;"><b>Cell: &nbsp; &nbsp; &nbsp; &nbsp; &nbsp;</b></span><span style="color:rgb(0,120,212);"><b>' + cell + '</b></span></div>',
                '<div style="line-height:normal;margin:0;font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;"><span style="color:#000;"><b>Email: &nbsp; &nbsp; &nbsp; </b></span><a href="mailto:' + mailtoEmail + '" style="color:rgb(0,120,212);"><b>' + email + '</b></a></div>',
                '<div style="line-height:normal;margin:0;font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;"><span style="color:#000;"><b>Website: </b></span><a href="http://www.combustiontechnology.co.za/" style="color:rgb(0,120,212);"><b>www.combustiontechnology.co.za</b></a></div>',
                '<p style="font-size:10pt;"><b><br></b></p>',
                '<div style="line-height:normal;font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;"><span style="color:#000;"><b>Download our </b></span><a href="#" style="color:rgb(200,38,19);"><b>Company Profile</b></a><span style="color:#000;"><b>.</b></span></div>',
                '<div style="line-height:normal;font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;"><span style="color:#000;"><b>Please complete our</b></span><b>&nbsp;</b><a href="#" style="color:rgb(200,38,19);"><b>Survey</b></a><span style="color:#000;"><b>, your opinion matters!</b></span></div>',
                '<div style="line-height:normal;font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;"><a href="#" style="color:rgb(200,38,19);"><b>SIGN UP</b></a><span style="color:#000;"><b>&nbsp;for the latest updates on promotions and industry news.</b></span></div>',
                '<div style="font-size:10pt;"><b><br></b></div>',
                '<div style="line-height:normal;font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;">',
                '<a href="#" style="text-decoration:none;"><img alt="LinkedIn" width="38" height="49" src="' + BASE_URL + '/assets/linkedin.png" style="width:38px;height:49px;"></a>&nbsp;&nbsp;<a href="#" style="text-decoration:none;"><img alt="Facebook" width="44" height="49" src="' + BASE_URL + '/assets/facebook.png" style="width:44px;height:49px;"></a>&nbsp;<a href="#" style="text-decoration:none;"><img alt="YouTube" width="38" height="49" src="' + BASE_URL + '/assets/youtube.png" style="width:38px;height:49px;"></a>&nbsp; &nbsp;<a href="#" style="text-decoration:none;"><img alt="Instagram" width="40" height="52" src="' + BASE_URL + '/assets/instagram.png" style="width:40px;height:52px;"></a></div>',
                '<div style="font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:12pt;color:#000;"><img alt="" src="' + BASE_URL + '/assets/banner.png" style="height:auto;max-width:100%;"></div>',
                '<div style="font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:8pt;color:#000;">At Combustion Technology we take great pride in protecting the personal information that we hold or process about our clients, employees, vendors and other stakeholders.</div>',
                '<div style="line-height:1.2;font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:8pt;"><span style="color:#000;">We are committed to best practice in complying with data protection requirements across our entire global operation.&nbsp;You can read our full POPIA Compliance Statement on our </span><a href="#" style="color:rgb(70,120,134);"><u>website</u></a><span style="color:#000;">.</span></div>',
                '<div style="line-height:1.2;font-family:Aptos,Calibri,Helvetica,sans-serif;font-size:8pt;"><span style="color:#000;">Want to change how you receive emails?&nbsp;You can </span><a href="#" style="color:rgb(70,120,134);"><u>update your preferences</u></a><span style="color:#000;">&nbsp;or send an email to </span><a href="mailto:info@combustiontechnology.co.za" style="color:rgb(70,120,134);"><u>info@combustiontechnology.co.za</u></a><span style="color:#000;">&nbsp;to be removed from our mailing&nbsp;list.</span></div>',
                '</div>'
            ].join('\n');
        }

        function showStatus(msg, type) {
            var el = document.getElementById("status");
            el.textContent = msg;
            el.className = "status " + type;
        }

        function showCurrentConfig(data) {
            document.getElementById("currentConfig").innerHTML =
                '<div class="current-config">' +
                '<b>Active signature for:</b><br>' +
                data.name + ' — ' + data.designation + '<br>' +
                'Cell: ' + data.cell + ' | Ext: ' + data.extension +
                '</div>';
        }
    </script>
</body>
</html>
